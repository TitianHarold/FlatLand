<!doctype html>
<html lang="zh-CN" data-ui-theme="dark">
<meta charset="utf-8"><title>摄影棚渲染检查</title>
<style>body{font:14px system-ui;margin:24px}iframe{width:900px;max-width:100%;height:420px;border:1px solid #ccc}pre{white-space:pre-wrap;line-height:1.8;max-height:150px;overflow:auto}</style>
<h1>摄影棚渲染检查</h1><pre id="result" role="status">正在运行…</pre>
<iframe id="frame" src="../world.html?studio=1" title="渲染验证场景"></iframe>
<script type="module">
import {createSimulation} from '../src/world.js';
import {createSight,observerFor} from '../src/sight.js';
import {OPTICS_RULES} from '../src/optics.js';
import * as THREE from 'three';
import {createScatter} from '../src/scatter.js';
const frame=document.querySelector('iframe'),output=document.querySelector('pre'),checks=[];
const assert=(condition,message)=>{if(!condition)throw new Error(message);checks.push(`PASS · ${message}`);output.textContent=checks.join('\n');};
const nextFrame=()=>new Promise(resolve=>frame.contentWindow.requestAnimationFrame(resolve));
async function until(condition){
  const start=performance.now();
  while(!condition()){if(performance.now()-start>8000)throw new Error(`等待场景超时：${condition}`);await nextFrame();}
}
async function readRow(fraction,inset=false){
  // Read in the same animation frame as the renderer, before compositing can
  // clear the default WebGL buffer. No preserved buffer or second draw needed.
  return new Promise(resolve=>frame.contentWindow.requestAnimationFrame(()=>{
    const canvas=frame.contentDocument.querySelector('#scene canvas'),gl=canvas.getContext('webgl2');
    const scene=frame.contentDocument.getElementById(inset?'sight-preview-window':'scene').getBoundingClientRect(),shown=canvas.getBoundingClientRect();
    const ratio=canvas.width/shown.width,count=inset?Math.floor(Math.floor(scene.width)*ratio):canvas.width;
    const pixels=new Uint8Array(count*4),x=inset?Math.floor(Math.floor(scene.left)*ratio):0;
    const y=scene.top+scene.height*(1-fraction);
    if(y<shown.top||y>=shown.bottom){for(let i=3;i<pixels.length;i+=4)pixels[i]=255;}
    else gl.readPixels(x,Math.min(canvas.height-1,Math.floor((shown.bottom-y)/shown.height*canvas.height)),count,1,gl.RGBA,gl.UNSIGNED_BYTE,pixels);
    resolve(pixels);
  }));
}
function assertSightMatch(actual,expected,label){
  const count=actual.length/4;let interiors=0,matches=0;
  for(let x=3;x<count-3;x++){
    if(![0,1,2].every(c=>[-3,-2,-1,1,2,3].every(dx=>Math.abs(expected[(x+dx)*4+c]-expected[x*4+c])<2)))continue;
    interiors++;
    if([0,1,2].every(c=>Math.abs(actual[x*4+c]-expected[x*4+c])<=2))matches++;
  }
  assert(interiors>count*.8&&matches/interiors>.99,`${label}：真实 GPU 投影与独立可见边积分一致（${matches}/${interiors}）`);
}
function verifyScatterKernel(){
  const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(512,128);renderer.autoClear=false;
  const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(60,4,.002,20000);
  camera.position.set(0,0,20);camera.lookAt(0,0,0);
  const geometry=new THREE.PlaneGeometry(.5,3),white=new THREE.MeshBasicMaterial({color:0xffffff});
  for(const x of [1,20]){const mesh=new THREE.Mesh(geometry,white);mesh.position.set(x,0,.032);scene.add(mesh);}
  const flatWindow={value:new THREE.Vector2()},eye={value:new THREE.Vector2()},viewportOrigin={value:new THREE.Vector2()};
  const scatter=createScatter(renderer,{flatWindow,eye,viewportOrigin,planeHeight:.032});
  const pixels=()=>{const gl=renderer.getContext(),row=new Uint8Array(512*4);gl.readPixels(0,64,512,1,gl.RGBA,gl.UNSIGNED_BYTE,row);return row;};
  renderer.clear();renderer.render(scene,camera);const sharp=pixels();
  const near=new THREE.Vector3(1,0,.032).project(camera),far=new THREE.Vector3(20,0,.032).project(camera);
  const nx=Math.round((near.x*.5+.5)*512),fx=Math.round((far.x*.5+.5)*512);
  scatter.render(scene,camera,{width:512,height:128},30,30,'smooth');const blurred=pixels();
  const sample=(row,x)=>row[x*4],around=(row,x)=>Array.from({length:19},(_,i)=>sample(row,x+i-9));
  assert(around(sharp,nx).every((v,i)=>Math.abs(v-around(blurred,nx)[i])<=2),'散射中心的近处轮廓保持清晰，不向两侧发虚');
  assert(Math.max(...around(blurred,fx))<Math.max(...around(sharp,fx))*.8&&around(blurred,fx).filter(v=>v>3).length>around(sharp,fx).filter(v=>v>3).length,'同样大小的远处轮廓确实向周围平均，亮峰降低且范围变宽');
  scatter.render(scene,camera,{width:512,height:128},40,30,'smooth');
  assert(pixels().every((v,i)=>v===blurred[i]),'扩大可见范围不改变已可见物体的模糊程度');
  scatter.render(scene,camera,{width:512,height:128},30,3,'smooth');const closerScatter=pixels();
  assert(Math.max(...around(closerScatter,fx))>3&&Math.max(...around(closerScatter,fx))<Math.max(...around(blurred,fx)),'缩短散射范围增强模糊，超过散射范围的物体仍可见');
  scatter.render(scene,camera,{width:512,height:128},10,30,'smooth');const clipped=pixels();
  assert(around(clipped,fx).every(v=>v===0)&&around(clipped,nx).every((v,i)=>Math.abs(v-around(blurred,nx)[i])<=2),'缩短可见范围截掉远处物体，同时保持近处清晰度');
  scatter.render(scene,camera,{width:512,height:128},0,30,'smooth');
  assert(pixels().every((v,i)=>v===blurred[i]),'关闭衰减边界后散射仍然显示，且模糊程度不变');
  const curvePeaks={};
  for(const curve of ['smooth','linear','quadratic','exponential','logarithmic']){
    scatter.render(scene,camera,{width:512,height:128},30,30,curve);
    curvePeaks[curve]=Math.max(...around(pixels(),fx));
    scatter.render(scene,camera,{width:512,height:128},30,3,curve);
    assert(around(pixels(),fx).every((v,i)=>Math.abs(v-around(closerScatter,fx)[i])<=2),`${curve}：超过散射距离统一达到最大模糊`);
  }
  assert(curvePeaks.logarithmic<curvePeaks.linear&&curvePeaks.linear<curvePeaks.quadratic&&curvePeaks.quadratic<curvePeaks.exponential,'GPU 散射曲线改变中途模糊的渐变节奏');
  renderer.setSize(640,160);camera.aspect=4;camera.updateProjectionMatrix();
  scatter.render(scene,camera,{width:640,height:160},30,30,'smooth');
  assert(renderer.getContext().getError()===0,'散射纹理随窗口尺寸更新，GPU 无错误');
  scatter.clear();geometry.dispose();white.dispose();renderer.dispose();renderer.forceContextLoss();
}
window.addEventListener('message',async function ready(event){
  if(event.source!==frame.contentWindow||event.origin!==location.origin||event.data?.type!=='flatland-studio-ready')return;
  window.removeEventListener('message',ready);
  try{
    verifyScatterKernel();
    const api=frame.contentWindow.flatlandStudio;
    api.set('wandering',false);
    await until(()=>api.snapshot().renderCalls>1);
    const originalOptics=api.snapshot().optics,originalPaint=JSON.stringify(api.snapshot().paint);
    const setTheme=async theme=>{
      frame.contentWindow.postMessage({type:'flatland-ui-theme',theme},location.origin);
      await until(()=>frame.contentDocument.documentElement.dataset.uiTheme===theme);
      await nextFrame();
    };
    api.set('coloring',false);await nextFrame();
    const darkInk=await readRow(.5,true);
    await setTheme('light');
    const paperInk=await readRow(.5,true);
    assert(darkInk.some((v,i)=>i%4!==3&&v>20)&&paperInk.every((v,i)=>i%4===3?v===255:Math.abs(v+darkInk[i]-255)<=2),'浅色无染色：实际 GPU 灰度反转，保留明暗层次与遮挡');
    api.set('coloring',true);await nextFrame();const paperPaint=await readRow(.5,true);
    await setTheme('dark');const darkPaint=await readRow(.5,true);
    let colored=0,matching=0;
    for(let i=0;i<darkPaint.length;i+=4){
      if(Math.max(...darkPaint.slice(i,i+3))-Math.min(...darkPaint.slice(i,i+3))<8)continue;
      colored++;
      if(Math.abs((paperPaint[i]-paperPaint[i+1])-(darkPaint[i]-darkPaint[i+1]))<=2&&Math.abs((paperPaint[i+1]-paperPaint[i+2])-(darkPaint[i+1]-darkPaint[i+2]))<=2)matching++;
    }
    assert(colored>10&&matching/colored>.99,'浅色染色：有色像素保持通道差与色相，不做全图反色');
    await setTheme('light');
    api.configure({visionEffect:'scatter',attenuationMode:'mask',attenuationDistance:.1});await nextFrame();
    for(const row of [.1,.5,.9])assert((await readRow(row,true)).every(v=>v===255),'浅色散射：遮罩与一维窗口外为空白，没有黑边');
    api.configure(originalOptics);await setTheme('dark');
    assert(JSON.stringify(api.snapshot().paint)===originalPaint,'切换主题不改写居民和建筑配色');
    for(let i=0;i<12;i++)await nextFrame();
    const idleUpdates=api.snapshot().lightingUpdates,idleRow=await readRow(.5,true);
    for(let i=0;i<12;i++)await nextFrame();
    assert(api.snapshot().lightingUpdates===idleUpdates,'静止场景复用明暗纹理，不再逐帧重算或上传');
    api.configure({});await nextFrame();
    assert(api.snapshot().lightingUpdates>idleUpdates,'光学配置更新使明暗缓存失效');
    assert((await readRow(.5,true)).every((v,i)=>v===idleRow[i]),'强制重算和复用缓存的真实画面像素完全一致');
    const {cameraFov,cameraAspect}=api.snapshot();
    assert(api.snapshot().observerVisible,'完全俯视时保留观察者');
    assert(api.snapshot().shapeHeight===.05/3&&api.snapshot().geometryHeight===0&&api.snapshot().wallHeight===0&&api.snapshot().stretch===0,'保留三分之一的基础高度，绝对俯视时实体与墙显示为零厚度');
    assert(api.snapshot().cameraDirection.every((n,i)=>Math.abs(n-[0,0,-1][i])<1e-8),'绝对俯视镜头垂直朝下');
    assert(!frame.contentDocument.getElementById('shape-height'),'独立场景也去掉基础高度调节');
    assert(api.snapshot().renderPoints===0,'没有粒子渲染');
    const preview=frame.contentDocument.getElementById('sight-preview'),minimap=frame.contentDocument.getElementById('minimap-panel');
    assert(!preview.hidden&&minimap.hidden&&frame.contentDocument.querySelectorAll('#scene canvas').length===1,'俯视显示居民视野预览，复用同一 WebGL 画布');
    const reference=await createSimulation({wandering:false}),sight=createSight(reference),overviewLight=api.snapshot().optics;
    api.set('contour',false);api.configure({attenuationDistance:0,fog:0});
    for(const projection of ['perspective','equidistant']){
      api.set('projection',projection);await nextFrame();
      const actual=await readRow(.5,true);
      const expected=sight(actual.length/4,{...OPTICS_RULES,coloring:true,contour:0,finish:'clear',glow:false,fog:0,attenuationDistance:0},observerFor(reference.player,120*Math.PI/180,projection));
      assertSightMatch(actual,expected,`${projection} / 俯视小窗`);
    }
    api.configure({attenuationMode:'mask',attenuationDistance:.1});await nextFrame();
    assert((await readRow(.5,true)).every((v,i)=>i%4===3?v===255:v===0),'小窗沿用真实遮罩，并排除观察者自身与俯视辅助线');
    api.set('projection','perspective');api.set('contour',true);api.configure(overviewLight);await nextFrame();
    api.set('perspective',50);
    await until(()=>Math.abs(api.snapshot().cameraProgress-.5)<.001);
    assert(!api.snapshot().observerVisible,'下降时不绘制观察者自身');
    assert(preview.hidden,'下降时关闭俯视小窗');
    assert(api.snapshot().renderedView==='world','下降途中只绘制世界，不提前叠加居民全屏');
    assert(api.snapshot().cameraFov===cameraFov&&api.snapshot().cameraAspect===cameraAspect,'下降途中保持同一透视镜头，不拉伸画面');
    api.click('resident');
    await until(()=>api.snapshot().cameraProgress===1);
    assert(api.snapshot().renderedView==='world'&&api.snapshot().renderTriangles>2,'居民视角继续绘制世界几何，不切换到独立光学画面');
    assert(!api.snapshot().observerVisible,'居民视角不绘制观察者自身');
    assert(preview.hidden&&!minimap.hidden,'居民视角切回位置地图，不叠加视野小窗');
    assert(api.snapshot().cameraFov===cameraFov&&api.snapshot().cameraAspect===cameraAspect,'下降到底保持同一透视镜头，不在末段拉伸');
    assert(api.snapshot().lineOnly&&api.snapshot().stretch===0,'下降终点自然停留在一维，没有自动拉伸');
    assert(api.snapshot().geometryHeight===.05/3&&api.snapshot().wallHeight===.05/3,'到达居民视角后，同一批实体与墙恢复设定的基础高度');
    const residentCanvas=frame.contentDocument.querySelector('#scene canvas');
    assert(api.snapshot().windowBlend<1,'镜头先到 0°，窗口随后展开');
    await until(()=>api.snapshot().windowBlend===1);
    assert(api.snapshot().windowHeight===8&&residentCanvas.height>1,'同一 3D 几何连续展开到默认 8% 窗口，缓冲区不切换');
    api.set('projection','equidistant');api.set('field-angle',160);
    const gl=residentCanvas.getContext('webgl2'),outside=new Uint8Array(residentCanvas.width*4);
    let escaped=false,rotation=0,lastAngle=api.snapshot().observer.angle;api.key('KeyD',true);
    for(let i=0;i<900&&!escaped&&rotation<Math.PI*2;i++){
      await nextFrame();
      const angle=api.snapshot().observer.angle,delta=angle-lastAngle;
      rotation+=Math.abs(Math.atan2(Math.sin(delta),Math.cos(delta)));lastAngle=angle;
      for(const y of [.3,.43,.57,.7]){
        gl.readPixels(0,Math.floor(residentCanvas.height*y),residentCanvas.width,1,gl.RGBA,gl.UNSIGNED_BYTE,outside);
        if(outside.some((v,index)=>index%4!==3&&v>2)){escaped=true;break;}
      }
    }
    api.key('KeyD',false);
    assert(!escaped&&rotation>=Math.PI*2,'矫正镜头旋转一周，墙顶不会在一维窗口外生成斜线或三角形');
    api.click('reset');api.set('projection','perspective');api.set('field-angle',120);await nextFrame();
    api.click('sight-line');
    for(const row of [.02,.1,.9,.98]){
      const pixels=await readRow(row);
      assert(pixels.every((v,i)=>i%4===3?v===255:v===0),`${row} 高度：自然空白方向为不透明纯黑`);
    }
    api.set('resident-window',20);await until(()=>api.snapshot().windowHeight===20);
    assert(api.snapshot().windowBlend===1,'一维窗口可调为视口高度的 20%');
    const windowCenter=await readRow(.5);
    for(const y of [.45,.55])assert((await readRow(y)).every((v,i)=>v===windowCenter[i]),'可见窗口内各高度保持同一维颜色');
    assert((await readRow(.3)).every((v,i)=>i%4===3?v===255:v===0),'一维窗口外仍是纯黑');
    api.set('resident-window',8);await until(()=>api.snapshot().windowHeight===8);
    const center=await readRow(.5);
    assert(center.some((v,i)=>i%4!==3&&v>0),'中央 3D 薄片仍然可见');
    assert(!frame.contentDocument.getElementById('sight-band'),'删除屏幕彩带厚度控制');
    const originalLight=api.snapshot().optics,originalRow=await readRow(.5);
    api.configure({residentEmission:2**-16,houseEmission:2**-16,exposure:12});await nextFrame();
    assert((await readRow(.5)).every((v,i)=>i%4===3||v<=1),'最低增益的实际画面接近全黑，RGB 不超过 1');
    api.configure(originalLight);await nextFrame();
    api.configure({wallColor:'#ff0000',customPaint:{colors:Array(5).fill('#ff0000')}});
    api.set('paint-style','custom');await nextFrame();
    const customRow=await readRow(.5);
    assert(customRow.some((v,i)=>i%4===0&&v>20)&&customRow.every((v,i)=>i%4===0||i%4===3||v===0),'自定义红色真正进入 3D 居民与建筑像素');
    api.configure({wallColor:'#928C99'});api.set('paint-style','dufy');await nextFrame();
    for(const [key,other] of [['residentEmission','houseEmission'],['houseEmission','residentEmission']]){
      api.configure({[key]:.02});await nextFrame();
      const row=await readRow(.5),optics=api.snapshot().optics;
      assert(row.some((value,i)=>i%4!==3&&value!==originalRow[i]),`${key}：分类明暗确实改变渲染像素`);
      assert(optics[other]===originalLight[other]&&optics.exposure===originalLight.exposure&&optics.fog===originalLight.fog,`${key}：不修改另一类或全局参数`);
      api.configure({[key]:originalLight[key]});await nextFrame();
    }
    for(const attenuationMode of ['brightness','wash','mask']){
      api.configure({attenuationMode,attenuationCurve:'smooth'});await nextFrame();
      const baseline=await readRow(.5);
      for(const attenuationCurve of ['linear','exponential','quadratic']){
        api.configure({attenuationCurve});await nextFrame();
        const row=await readRow(.5);
        assert(row.some((v,i)=>i%4!==3&&v!==baseline[i]),`${attenuationMode} / ${attenuationCurve}：曲线实际改变同一 3D 场景的像素`);
      }
    }
    api.configure({attenuationMode:'mask',attenuationDistance:.1});await nextFrame();
    assert((await readRow(.5)).every((v,i)=>i%4===3?v===255:v===0),'最远可见距离外的 3D 物体全黑，纹理插值不漏光');
    api.configure({attenuationDistance:0});await nextFrame();
    assert((await readRow(.5)).some((v,i)=>i%4!==3&&v>0),'关闭遮罩后恢复真实场景颜色');
    api.configure(originalLight);await nextFrame();
    const planar=await readRow(.5);
    api.set('projection','equidistant');await nextFrame();
    const curved=await readRow(.5);
    assert(curved.some((v,i)=>i%4===0&&Math.max(v,curved[i+1],curved[i+2])-Math.min(v,curved[i+1],curved[i+2])>25),'曲面接收保留可见居民，墙不会错误遮住整幅视野');
    assert(curved.some((v,i)=>i%4!==3&&v!==planar[i]),'曲面等角实际改变横向接收，与平面透视不同');
    // Compare the GPU's receiving geometry and occlusion against the independent
    // interval integrator, excluding only antialiased colour boundaries.
    api.set('contour',false);api.configure({attenuationDistance:0,fog:0});
    for(const projection of ['perspective','equidistant'])for(const fov of [60,120,160]){
      api.set('projection',projection);api.set('field-angle',fov);await nextFrame();
      const actual=await readRow(.5),count=actual.length/4;
      const expected=sight(count,{...OPTICS_RULES,coloring:true,contour:0,finish:'clear',glow:false,fog:0,attenuationDistance:0},observerFor(reference.player,fov*Math.PI/180,projection));
      assertSightMatch(actual,expected,`${projection} / ${fov}°`);
    }
    reference.dispose();api.set('field-angle',120);api.set('contour',true);api.configure(originalLight);
    api.set('projection','perspective');await nextFrame();
    api.set('coloring',false);await nextFrame();
    assert(api.snapshot().optics.displayEnhancement,'关闭染色自动启用真实几何深度的显示增强');
    const gray=await readRow(.5),levels=[];
    for(let i=0;i<gray.length;i+=4){if(gray[i])levels.push(gray[i]);if(gray[i]!==gray[i+1]||gray[i]!==gray[i+2])throw new Error('无染色不能残留色相');}
    assert(new Set(levels).size>3,'无染色保持灰度层次，不是统一白线');
    for(const coloring of [false,true])for(const [material,other] of [['residentEmission','houseEmission'],['houseEmission','residentEmission']]){
      api.set('coloring',coloring);
      api.configure({[material]:1,[other]:0,attenuationMode:'mask',attenuationDistance:3000,detailGain:1});await nextFrame();
      const low=await readRow(.5);api.configure({detailGain:8});await nextFrame();const high=await readRow(.5);
      assert(high.some((v,i)=>i%4!==3&&low[i]-v>10),`${coloring?'染色':'灰度'} / ${material}：大视野下区分度增益增强实际几何明暗`);
      assert(high.every((v,i)=>i%4===3||low[i]!==0||v===0),`${material}：增强不泄漏被遮挡或原本无光的位置`);
      if(coloring){
        let colored=0;
        for(let i=0;i<low.length;i+=4){
          const a=Math.max(...low.subarray(i,i+3)),b=Math.max(...high.subarray(i,i+3));
          if(b<20||a-Math.min(...low.subarray(i,i+3))<5)continue;
          colored++;
          if(![0,1,2].every(c=>Math.abs(low[i+c]/a-high[i+c]/b)<.06))throw new Error('区分度增益改变了配色色相');
        }
        assert(colored>10,`${material}：增强后仍保留实际染色色相`);
      }
    }
    api.set('coloring',false);api.configure(originalLight);await nextFrame();
    const geometricGray=await readRow(.5);
    api.set('paint-style','grayscale');await nextFrame();
    assert((await readRow(.5)).every((v,i)=>v===geometricGray[i]),'无染色的几何增强与头白尾灰配色互不影响');
    api.set('coloring',true);await nextFrame();
    assert((await readRow(.5)).some((v,i)=>i%4!==3&&v!==geometricGray[i]),'开启头白尾灰配色使用固定身体染色，与几何明暗不同');
    api.set('paint-style','dufy');await nextFrame();
    assert(api.snapshot().optics.displayEnhancement,'恢复染色后区分度增益继续生效');
    for(const coloring of [false,true])for(const detailStyle of ['sharp','soft','velvet']){
      api.set('coloring',coloring);api.configure({detailGain:0,detailStyle});api.set('contour',true);await nextFrame();
      const disabled=await readRow(.5);api.set('contour',false);await nextFrame();

    assert(lab.querySelector('.topbar').getBoundingClientRect().height===0&&lab.querySelector('.action-panel').getBoundingClientRect().height>0,'内嵌实验隐藏重复顶栏，保留角色动作控件');

    lab.getElementById('reset').click();
    assert(panel.querySelector('#preview').contentWindow.flatlandStudio.snapshot().playerState==='alive','内嵌角色实验可正常重置');

    for(const enabled of [false,true]){
